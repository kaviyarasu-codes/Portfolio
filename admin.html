<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | Kaviyarasu K</title>
    <meta name="robots" content="noindex, nofollow" />

    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/favicon-180x180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="/assets/vendor/fontawesome/css/all.min.css" />

    <script src="/assets/js/theme-init.js" data-default="dark"></script>

    <style>
        /* ── Tokens (match portfolio) ── */
        :root,
        [data-theme="dark"] {
            --bg: #0A1628;
            --bg-2: #0C1A30;
            --card: #0F1F36;
            --card-2: #132745;
            --border: #1E3A5F;
            --text: #F8FAFC;
            --text-mid: #CBD5E1;
            --text-muted: #94A3B8;
            --surface: rgba(56, 189, 248, .06);
            --nav-bg: rgba(10, 22, 40, .9);
            --indigo: #4FD1F5;
            --indigo-l: #7DD3FC;
            --emerald: #7CCFA4;
            --emerald-l: #A8E6CF;
            --glow-i: rgba(56, 189, 248, .35);
            --b-i: rgba(56, 189, 248, .28);
            --b-e: rgba(124, 207, 164, .22);
            --grad-mix: linear-gradient(135deg, #38BDF8 0%, #7CCFA4 100%);
            --grad-i: linear-gradient(135deg, #2563EB, #3B82F6);
            --r-md: 18px;
            --t: .3s;
            --ease: cubic-bezier(.4, 0, .2, 1);
            --font-head: 'Bricolage Grotesque', sans-serif;
            --font-body: 'Instrument Sans', sans-serif;
            --danger: #FB7185;
            --danger-bg: rgba(244, 63, 94, .08);
            --danger-border: rgba(244, 63, 94, .22);
        }

        [data-theme="light"] {
            --bg: #F5F8FC;
            --bg-2: #EDF2F9;
            --card: #FFFFFF;
            --card-2: #F1F5FB;
            --border: #D3DEEC;
            --text: #0A1628;
            --text-mid: #2E425E;
            --text-muted: #5B6F8C;
            --surface: rgba(124, 207, 164, .10);
            --nav-bg: rgba(233, 237, 242, .96);
        }

        /* ── Reset ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html {
            scroll-behavior: smooth
        }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
            line-height: 1.65;
            min-height: 100vh;
            transition: background .35s, color .35s
        }

        a {
            text-decoration: none;
            color: inherit
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            outline: none
        }

        input {
            font-family: inherit;
            outline: none
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin-inline: auto
        }

        .grad-text {
            background: var(--grad-mix);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text
        }

        /* ── Top Bar ── */
        .admin-topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--nav-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--border);
            padding: 14px 0;
        }

        .topbar-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap
        }

        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-head);
            font-weight: 700;
            font-size: 1.1rem
        }

        .topbar-brand i {
            font-size: 1.3rem;
            color: var(--indigo)
        }

        .topbar-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        /* ── Buttons ── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 12px;
            font-family: var(--font-head);
            font-weight: 600;
            font-size: .85rem;
            transition: all var(--t) var(--ease);
            white-space: nowrap;
            border: none
        }

        .btn-primary {
            background: var(--grad-i);
            color: #fff;
            box-shadow: 0 4px 16px var(--glow-i)
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px var(--glow-i)
        }

        .btn-ghost {
            background: var(--surface);
            color: var(--text-mid);
            border: 1px solid var(--border)
        }

        .btn-ghost:hover {
            border-color: var(--indigo);
            color: var(--indigo)
        }

        .btn-danger {
            background: var(--danger-bg);
            color: var(--danger);
            border: 1px solid var(--danger-border)
        }

        .btn-danger:hover {
            background: rgba(244, 63, 94, .18);
            transform: translateY(-1px)
        }

        .btn-sm {
            padding: 7px 14px;
            font-size: .78rem;
            border-radius: 10px
        }

        /* ── Login Card ── */
        .login-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 44px 36px;
            border-radius: 24px;
            background: var(--card);
            border: 1px solid var(--border);
            box-shadow: 0 20px 60px rgba(0, 0, 0, .25);
            text-align: center;
            animation: cardIn .6s var(--ease) both;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(.97)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        .login-card h2 {
            font-family: var(--font-head);
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 6px
        }

        .login-card p {
            color: var(--text-muted);
            font-size: .88rem;
            margin-bottom: 28px
        }

        .login-card .lock-icon {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            margin: 0 auto 20px;
            background: var(--grad-mix);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #fff;
            box-shadow: 0 8px 32px var(--glow-i);
        }

        .fg {
            margin-bottom: 16px;
            text-align: left
        }

        .fg label {
            display: block;
            font-size: .78rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: .06em
        }

        .fg input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: .92rem;
            transition: border-color var(--t);
        }

        .fg input:focus {
            border-color: var(--indigo);
            box-shadow: 0 0 0 3px var(--glow-i)
        }

        .login-error {
            color: var(--danger);
            font-size: .82rem;
            margin-top: 12px;
            display: none
        }

        /* ── Dashboard ── */
        .dashboard {
            padding: 32px 0 60px;
            display: none
        }

        /* Stats row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin-bottom: 28px
        }

        .stat-card {
            padding: 20px;
            border-radius: 16px;
            background: var(--card);
            border: 1px solid var(--border);
            text-align: center;
        }

        .stat-card .stat-num {
            font-family: var(--font-head);
            font-size: 2rem;
            font-weight: 800;
            background: var(--grad-mix);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text
        }

        .stat-card .stat-label {
            font-size: .78rem;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 500
        }

        /* Search */
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            align-items: center;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 6px 16px;
        }

        .search-bar i {
            color: var(--text-muted);
            font-size: 1rem
        }

        .search-bar input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: .92rem;
            padding: 10px 0
        }

        .search-bar input::placeholder {
            color: var(--text-muted)
        }

        /* Messages */
        .msg-list {
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .msg-card {
            padding: 22px;
            border-radius: 16px;
            background: var(--card);
            border: 1px solid var(--border);
            transition: all var(--t) var(--ease);
            position: relative;
            animation: cardIn .4s var(--ease) both;
        }

        .msg-card:hover {
            border-color: var(--b-i);
            box-shadow: 0 8px 32px rgba(56, 189, 248, .08)
        }

        .msg-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px
        }

        .msg-sender {
            font-family: var(--font-head);
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text)
        }

        .msg-email {
            font-size: .82rem;
            color: var(--indigo-l)
        }

        .msg-subject {
            font-weight: 600;
            color: var(--emerald-l);
            font-size: .9rem;
            margin-bottom: 6px
        }

        .msg-body {
            color: var(--text-mid);
            font-size: .88rem;
            line-height: 1.7
        }

        .msg-time {
            font-size: .72rem;
            color: var(--text-muted);
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 6px
        }

        .msg-delete {
            flex-shrink: 0
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted)
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: .4
        }

        .empty-state p {
            font-size: .95rem
        }

        /* Live badge */
        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: .7rem;
            font-weight: 700;
            letter-spacing: .05em;
            background: rgba(124, 207, 164, .1);
            border: 1px solid var(--b-e);
            color: var(--emerald-l)
        }

        .live-badge .pulse {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--emerald);
            animation: blink 1.3s ease-in-out infinite
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .2
            }
        }

        /* Confirm modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .55);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px)
        }

        .modal-overlay.show {
            display: flex
        }

        .modal-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
            animation: cardIn .3s var(--ease) both
        }

        .modal-box h3 {
            font-family: var(--font-head);
            font-weight: 700;
            margin-bottom: 8px
        }

        .modal-box p {
            color: var(--text-muted);
            font-size: .88rem;
            margin-bottom: 24px
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center
        }

        /* Responsive */
        @media(max-width:600px) {
            .topbar-inner {
                flex-direction: column;
                align-items: flex-start
            }

            .topbar-actions {
                width: 100%;
                justify-content: flex-start
            }

            .stats-row {
                grid-template-columns: 1fr 1fr
            }

            .msg-header {
                flex-direction: column
            }
        }

        /* ── v2: filters, toast, reply ── */
        .toolbar { display: flex; gap: 10px; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap }
        .chips { display: flex; gap: 8px; flex-wrap: wrap }
        .chip-btn { padding: 7px 14px; border-radius: 999px; font-size: .78rem; font-weight: 600; background: var(--surface); color: var(--text-mid); border: 1px solid var(--border); font-family: var(--font-head) }
        .chip-btn.active { background: var(--grad-i); color: #fff; border-color: transparent }
        .chip-btn .n { opacity: .75; margin-left: 4px }
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 12px 20px; border-radius: 12px; font-size: .85rem; box-shadow: 0 12px 40px rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: all .3s var(--ease); z-index: 1000 }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0) }
        .toast.err { border-color: var(--danger-border); color: var(--danger) }
        .msg-body { white-space: pre-wrap; word-break: break-word }
        .btn[disabled] { opacity: .5; cursor: not-allowed; transform: none !important }
        .list-footer { text-align: center; margin-top: 18px; font-size: .8rem; color: var(--text-muted) }
        [data-theme="light"] .msg-email { color: #0284C7 }
        [data-theme="light"] .msg-subject { color: #059669 }
        :focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px }
    </style>
</head>

<body>

    <!-- ══════ LOGIN ══════ -->
    <div class="login-wrap" id="loginBox">
        <div class="login-card">
            <img src="assets/img/logo-mark.png" alt="" width="120" height="88" style="height:64px;width:auto;margin:0 auto 18px;filter:drop-shadow(0 0 10px rgba(79,209,245,.4))" />
            <h2><span class="grad-text">Admin Access</span></h2>
            <p>Restricted to authorized personnel only</p>
            <div class="fg">
                <label for="adminEmail"><i class="fa fa-envelope"></i> Email</label>
                <input id="adminEmail" type="email" placeholder="admin@example.com" autocomplete="email" />
            </div>
            <div class="fg">
                <label for="adminPassword"><i class="fa fa-lock"></i> Password</label>
                <input id="adminPassword" type="password" placeholder="••••••••" autocomplete="current-password" />
            </div>
            <button type="button" class="btn btn-primary" id="loginBtn" style="width:100%;justify-content:center;margin-top:8px">
                <i class="fa fa-right-to-bracket"></i> Sign In
            </button>
            <div class="login-error" id="loginError"></div>
        </div>
    </div>

    <!-- ══════ DASHBOARD ══════ -->
    <div class="dashboard" id="dashboard">

        <div class="admin-topbar">
            <div class="container topbar-inner">
                <div class="topbar-brand">
                    <i class="fa fa-shield-halved" aria-hidden="true"></i>
                    <span>Admin Dashboard</span>
                    <span class="live-badge"><span class="pulse"></span> LIVE</span>
                </div>
                <div class="topbar-actions">
                    <a class="btn btn-ghost btn-sm" href="/" title="Open portfolio"><i class="fa fa-house" aria-hidden="true"></i></a>
                    <button type="button" class="btn btn-ghost btn-sm" id="themeToggle" aria-label="Toggle theme">
                        <i class="fa fa-sun" id="themeIcon" aria-hidden="true"></i>
                    </button>
                    <a class="btn btn-ghost btn-sm" href="site-audit" title="Audit a website or APK">
                        <i class="fa fa-magnifying-glass-chart" aria-hidden="true"></i> Site Audit
                    </a>
                    <button type="button" class="btn btn-ghost btn-sm" id="exportBtn">
                        <i class="fa fa-file-excel" aria-hidden="true"></i> Export All
                    </button>
                    <button type="button" class="btn btn-danger btn-sm" id="logoutBtn">
                        <i class="fa fa-right-from-bracket" aria-hidden="true"></i> Logout
                    </button>
                </div>
            </div>
        </div>

        <div class="container" style="padding-top:28px">
            <div class="stats-row" id="statsRow">
                <div class="stat-card"><div class="stat-num" id="statTotal">–</div><div class="stat-label">Total Messages</div></div>
                <div class="stat-card"><div class="stat-num" id="statUnread">–</div><div class="stat-label">Unread</div></div>
                <div class="stat-card"><div class="stat-num" id="statToday">–</div><div class="stat-label">Today</div></div>
                <div class="stat-card"><div class="stat-num" id="statWeek">–</div><div class="stat-label">Last 7 Days</div></div>
            </div>

            <div class="search-bar">
                <i class="fa fa-search" aria-hidden="true"></i>
                <input id="searchInput" type="search" placeholder="Search by name, email, subject or message..." aria-label="Search messages" />
            </div>

            <div class="toolbar">
                <div class="chips" role="toolbar" aria-label="Filter messages">
                    <button type="button" class="chip-btn active" data-filter="all">All<span class="n" id="nAll"></span></button>
                    <button type="button" class="chip-btn" data-filter="unread">Unread<span class="n" id="nUnread"></span></button>
                    <button type="button" class="chip-btn" data-filter="starred">Starred<span class="n" id="nStarred"></span></button>
                </div>
                <button type="button" class="btn btn-ghost btn-sm" id="markAllReadBtn">
                    <i class="fa fa-envelope-open" aria-hidden="true"></i> Mark Shown as Read
                </button>
            </div>

            <div class="msg-list" id="messages"></div>

            <div class="list-footer">
                <button type="button" class="btn btn-ghost btn-sm" id="loadMoreBtn">
                    <i class="fa fa-plus" aria-hidden="true"></i> Load More
                </button>
                <div id="loadedInfo" style="margin-top:8px"></div>
            </div>
        </div>
    </div>

    <!-- ══════ DELETE CONFIRM MODAL ══════ -->
    <div class="modal-overlay" id="deleteModal" role="dialog" aria-modal="true" aria-labelledby="delTitle">
        <div class="modal-box">
            <h3 id="delTitle">🗑️ Delete Message?</h3>
            <p>This action cannot be undone. The message will be permanently removed.</p>
            <div class="modal-actions">
                <button type="button" class="btn btn-ghost" id="cancelDelete">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmDelete"><i class="fa fa-trash" aria-hidden="true"></i> Delete</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- SheetJS (pinned, official CDN) -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

    <script type="module" src="/assets/js/admin.js"></script>

</body>

</html>
