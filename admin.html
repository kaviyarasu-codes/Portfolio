<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | Kaviyarasu K</title>
    <meta name="robots" content="noindex, nofollow" />

    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32x32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        crossorigin="anonymous" />

    <script>!function () { var t = 'dark'; try { t = localStorage.getItem('kk-theme') || 'dark' } catch (e) { } document.documentElement.setAttribute('data-theme', t) }();</script>

    <style>
        /* ── Tokens (match portfolio) ── */
        :root,
        [data-theme="dark"] {
            --bg: #0F172A;
            --bg-2: #1E293B;
            --card: #1E293B;
            --card-2: #334155;
            --border: rgba(51, 65, 85, .8);
            --text: #F8FAFC;
            --text-mid: #CBD5E1;
            --text-muted: #94A3B8;
            --surface: rgba(56, 189, 248, .06);
            --nav-bg: rgba(15, 23, 42, .93);
            --indigo: #38BDF8;
            --indigo-l: #7DD3FC;
            --emerald: #7CCFA4;
            --emerald-l: #A8E6CF;
            --glow-i: rgba(56, 189, 248, .35);
            --b-i: rgba(56, 189, 248, .28);
            --b-e: rgba(124, 207, 164, .22);
            --grad-mix: linear-gradient(135deg, #38BDF8 0%, #7CCFA4 100%);
            --grad-i: linear-gradient(135deg, #38BDF8, #0284C7);
            --r-md: 18px;
            --t: .3s;
            --ease: cubic-bezier(.4, 0, .2, 1);
            --font-head: 'Poppins', sans-serif;
            --font-body: 'Inter', sans-serif;
            --danger: #FB7185;
            --danger-bg: rgba(244, 63, 94, .08);
            --danger-border: rgba(244, 63, 94, .22);
        }

        [data-theme="light"] {
            --bg: #E9EDF2;
            --bg-2: #F0F4F8;
            --card: rgba(255, 255, 255, .55);
            --card-2: #E2EAF0;
            --border: rgba(124, 207, 164, .20);
            --text: #5B636A;
            --text-mid: #5B636A;
            --text-muted: #8A939B;
            --surface: rgba(124, 207, 164, .10);
            --nav-bg: rgba(233, 237, 242, .96);
        }

        /* ── Reset ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html {
            scroll-behavior: smooth
        }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
            line-height: 1.65;
            min-height: 100vh;
            transition: background .35s, color .35s
        }

        a {
            text-decoration: none;
            color: inherit
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            outline: none
        }

        input {
            font-family: inherit;
            outline: none
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin-inline: auto
        }

        .grad-text {
            background: var(--grad-mix);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text
        }

        /* ── Top Bar ── */
        .admin-topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--nav-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--border);
            padding: 14px 0;
        }

        .topbar-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap
        }

        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-head);
            font-weight: 700;
            font-size: 1.1rem
        }

        .topbar-brand i {
            font-size: 1.3rem;
            color: var(--indigo)
        }

        .topbar-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        /* ── Buttons ── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 12px;
            font-family: var(--font-head);
            font-weight: 600;
            font-size: .85rem;
            transition: all var(--t) var(--ease);
            white-space: nowrap;
            border: none
        }

        .btn-primary {
            background: var(--grad-i);
            color: #fff;
            box-shadow: 0 4px 16px var(--glow-i)
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px var(--glow-i)
        }

        .btn-ghost {
            background: var(--surface);
            color: var(--text-mid);
            border: 1px solid var(--border)
        }

        .btn-ghost:hover {
            border-color: var(--indigo);
            color: var(--indigo)
        }

        .btn-danger {
            background: var(--danger-bg);
            color: var(--danger);
            border: 1px solid var(--danger-border)
        }

        .btn-danger:hover {
            background: rgba(244, 63, 94, .18);
            transform: translateY(-1px)
        }

        .btn-sm {
            padding: 7px 14px;
            font-size: .78rem;
            border-radius: 10px
        }

        /* ── Login Card ── */
        .login-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 44px 36px;
            border-radius: 24px;
            background: var(--card);
            border: 1px solid var(--border);
            box-shadow: 0 20px 60px rgba(0, 0, 0, .25);
            text-align: center;
            animation: cardIn .6s var(--ease) both;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(.97)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        .login-card h2 {
            font-family: var(--font-head);
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 6px
        }

        .login-card p {
            color: var(--text-muted);
            font-size: .88rem;
            margin-bottom: 28px
        }

        .login-card .lock-icon {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            margin: 0 auto 20px;
            background: var(--grad-mix);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #fff;
            box-shadow: 0 8px 32px var(--glow-i);
        }

        .fg {
            margin-bottom: 16px;
            text-align: left
        }

        .fg label {
            display: block;
            font-size: .78rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: .06em
        }

        .fg input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: .92rem;
            transition: border-color var(--t);
        }

        .fg input:focus {
            border-color: var(--indigo);
            box-shadow: 0 0 0 3px var(--glow-i)
        }

        .login-error {
            color: var(--danger);
            font-size: .82rem;
            margin-top: 12px;
            display: none
        }

        /* ── Dashboard ── */
        .dashboard {
            padding: 32px 0 60px;
            display: none
        }

        /* Stats row */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin-bottom: 28px
        }

        .stat-card {
            padding: 20px;
            border-radius: 16px;
            background: var(--card);
            border: 1px solid var(--border);
            text-align: center;
        }

        .stat-card .stat-num {
            font-family: var(--font-head);
            font-size: 2rem;
            font-weight: 800;
            background: var(--grad-mix);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text
        }

        .stat-card .stat-label {
            font-size: .78rem;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 500
        }

        /* Search */
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            align-items: center;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 6px 16px;
        }

        .search-bar i {
            color: var(--text-muted);
            font-size: 1rem
        }

        .search-bar input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: .92rem;
            padding: 10px 0
        }

        .search-bar input::placeholder {
            color: var(--text-muted)
        }

        /* Messages */
        .msg-list {
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .msg-card {
            padding: 22px;
            border-radius: 16px;
            background: var(--card);
            border: 1px solid var(--border);
            transition: all var(--t) var(--ease);
            position: relative;
            animation: cardIn .4s var(--ease) both;
        }

        .msg-card:hover {
            border-color: var(--b-i);
            box-shadow: 0 8px 32px rgba(56, 189, 248, .08)
        }

        .msg-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px
        }

        .msg-sender {
            font-family: var(--font-head);
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text)
        }

        .msg-email {
            font-size: .82rem;
            color: var(--indigo-l)
        }

        .msg-subject {
            font-weight: 600;
            color: var(--emerald-l);
            font-size: .9rem;
            margin-bottom: 6px
        }

        .msg-body {
            color: var(--text-mid);
            font-size: .88rem;
            line-height: 1.7
        }

        .msg-time {
            font-size: .72rem;
            color: var(--text-muted);
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 6px
        }

        .msg-delete {
            flex-shrink: 0
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted)
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: .4
        }

        .empty-state p {
            font-size: .95rem
        }

        /* Live badge */
        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: .7rem;
            font-weight: 700;
            letter-spacing: .05em;
            background: rgba(124, 207, 164, .1);
            border: 1px solid var(--b-e);
            color: var(--emerald-l)
        }

        .live-badge .pulse {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--emerald);
            animation: blink 1.3s ease-in-out infinite
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: .2
            }
        }

        /* Confirm modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .55);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px)
        }

        .modal-overlay.show {
            display: flex
        }

        .modal-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
            animation: cardIn .3s var(--ease) both
        }

        .modal-box h3 {
            font-family: var(--font-head);
            font-weight: 700;
            margin-bottom: 8px
        }

        .modal-box p {
            color: var(--text-muted);
            font-size: .88rem;
            margin-bottom: 24px
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: center
        }

        /* Responsive */
        @media(max-width:600px) {
            .topbar-inner {
                flex-direction: column;
                align-items: flex-start
            }

            .topbar-actions {
                width: 100%;
                justify-content: flex-start
            }

            .stats-row {
                grid-template-columns: 1fr 1fr
            }

            .msg-header {
                flex-direction: column
            }
        }

        /* ── v2: filters, toast, reply ── */
        .toolbar { display: flex; gap: 10px; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap }
        .chips { display: flex; gap: 8px; flex-wrap: wrap }
        .chip-btn { padding: 7px 14px; border-radius: 999px; font-size: .78rem; font-weight: 600; background: var(--surface); color: var(--text-mid); border: 1px solid var(--border); font-family: var(--font-head) }
        .chip-btn.active { background: var(--grad-i); color: #fff; border-color: transparent }
        .chip-btn .n { opacity: .75; margin-left: 4px }
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 12px 20px; border-radius: 12px; font-size: .85rem; box-shadow: 0 12px 40px rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: all .3s var(--ease); z-index: 1000 }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0) }
        .toast.err { border-color: var(--danger-border); color: var(--danger) }
        .msg-body { white-space: pre-wrap; word-break: break-word }
        .btn[disabled] { opacity: .5; cursor: not-allowed; transform: none !important }
        .list-footer { text-align: center; margin-top: 18px; font-size: .8rem; color: var(--text-muted) }
        [data-theme="light"] .msg-email { color: #0284C7 }
        [data-theme="light"] .msg-subject { color: #059669 }
        :focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px }
    </style>
</head>

<body>

    <!-- ══════ LOGIN ══════ -->
    <div class="login-wrap" id="loginBox">
        <div class="login-card">
            <div class="lock-icon"><i class="fa fa-shield-halved"></i></div>
            <h2><span class="grad-text">Admin Access</span></h2>
            <p>Restricted to authorized personnel only</p>
            <div class="fg">
                <label for="adminEmail"><i class="fa fa-envelope"></i> Email</label>
                <input id="adminEmail" type="email" placeholder="admin@example.com" autocomplete="email" />
            </div>
            <div class="fg">
                <label for="adminPassword"><i class="fa fa-lock"></i> Password</label>
                <input id="adminPassword" type="password" placeholder="••••••••" autocomplete="current-password" />
            </div>
            <button type="button" class="btn btn-primary" id="loginBtn" style="width:100%;justify-content:center;margin-top:8px">
                <i class="fa fa-right-to-bracket"></i> Sign In
            </button>
            <div class="login-error" id="loginError"></div>
        </div>
    </div>

    <!-- ══════ DASHBOARD ══════ -->
    <div class="dashboard" id="dashboard">

        <div class="admin-topbar">
            <div class="container topbar-inner">
                <div class="topbar-brand">
                    <i class="fa fa-shield-halved" aria-hidden="true"></i>
                    <span>Admin Dashboard</span>
                    <span class="live-badge"><span class="pulse"></span> LIVE</span>
                </div>
                <div class="topbar-actions">
                    <a class="btn btn-ghost btn-sm" href="index.html" title="Open portfolio"><i class="fa fa-house" aria-hidden="true"></i></a>
                    <button type="button" class="btn btn-ghost btn-sm" id="themeToggle" aria-label="Toggle theme">
                        <i class="fa fa-sun" id="themeIcon" aria-hidden="true"></i>
                    </button>
                    <button type="button" class="btn btn-ghost btn-sm" id="exportBtn">
                        <i class="fa fa-file-excel" aria-hidden="true"></i> Export All
                    </button>
                    <button type="button" class="btn btn-danger btn-sm" id="logoutBtn">
                        <i class="fa fa-right-from-bracket" aria-hidden="true"></i> Logout
                    </button>
                </div>
            </div>
        </div>

        <div class="container" style="padding-top:28px">
            <div class="stats-row" id="statsRow">
                <div class="stat-card"><div class="stat-num" id="statTotal">–</div><div class="stat-label">Total Messages</div></div>
                <div class="stat-card"><div class="stat-num" id="statUnread">–</div><div class="stat-label">Unread</div></div>
                <div class="stat-card"><div class="stat-num" id="statToday">–</div><div class="stat-label">Today</div></div>
                <div class="stat-card"><div class="stat-num" id="statWeek">–</div><div class="stat-label">Last 7 Days</div></div>
            </div>

            <div class="search-bar">
                <i class="fa fa-search" aria-hidden="true"></i>
                <input id="searchInput" type="search" placeholder="Search by name, email, subject or message..." aria-label="Search messages" />
            </div>

            <div class="toolbar">
                <div class="chips" role="toolbar" aria-label="Filter messages">
                    <button type="button" class="chip-btn active" data-filter="all">All<span class="n" id="nAll"></span></button>
                    <button type="button" class="chip-btn" data-filter="unread">Unread<span class="n" id="nUnread"></span></button>
                    <button type="button" class="chip-btn" data-filter="starred">Starred<span class="n" id="nStarred"></span></button>
                </div>
                <button type="button" class="btn btn-ghost btn-sm" id="markAllReadBtn">
                    <i class="fa fa-envelope-open" aria-hidden="true"></i> Mark Shown as Read
                </button>
            </div>

            <div class="msg-list" id="messages"></div>

            <div class="list-footer">
                <button type="button" class="btn btn-ghost btn-sm" id="loadMoreBtn">
                    <i class="fa fa-plus" aria-hidden="true"></i> Load More
                </button>
                <div id="loadedInfo" style="margin-top:8px"></div>
            </div>
        </div>
    </div>

    <!-- ══════ DELETE CONFIRM MODAL ══════ -->
    <div class="modal-overlay" id="deleteModal" role="dialog" aria-modal="true" aria-labelledby="delTitle">
        <div class="modal-box">
            <h3 id="delTitle">🗑️ Delete Message?</h3>
            <p>This action cannot be undone. The message will be permanently removed.</p>
            <div class="modal-actions">
                <button type="button" class="btn btn-ghost" id="cancelDelete">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirmDelete"><i class="fa fa-trash" aria-hidden="true"></i> Delete</button>
            </div>
        </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- SheetJS (pinned, official CDN) -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut }
            from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import {
            getFirestore, collection, onSnapshot, query, orderBy, where, doc, deleteDoc,
            limit, getDocs, updateDoc, writeBatch, getCountFromServer, Timestamp
        } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDSH6Ryd0MtbQOTiK1GYBSQa8oe65TGXpA",
            authDomain: "portfolio-contact-39c14.firebaseapp.com",
            projectId: "portfolio-contact-39c14",
            storageBucket: "portfolio-contact-39c14.firebasestorage.app",
            messagingSenderId: "1011375934660",
            appId: "1:1011375934660:web:ac5b4ab463dc122de48d91"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const contactsCol = collection(db, "contacts");

        // UI gate only — real protection must come from Firestore security rules.
        const ALLOWED_EMAIL = "kaviyarasu.0aasai@gmail.com";
        const PAGE_SIZE = 10;

        let pages = 1;               // live window = PAGE_SIZE * pages (keeps "Load More" results live too)
        let allMessages = [];
        let hasMore = false;
        let unsubscribe = null;
        let deleteTargetId = null;
        let activeFilter = "all";

        const $ = (id) => document.getElementById(id);
        const loginBox = $("loginBox"), dashboard = $("dashboard"), loginError = $("loginError");
        const msgContainer = $("messages"), searchInput = $("searchInput"), deleteModal = $("deleteModal");
        const loadMoreBtn = $("loadMoreBtn");

        function toast(text, isErr = false) {
            const t = $("toast");
            t.textContent = text;
            t.className = "toast show" + (isErr ? " err" : "");
            clearTimeout(t._h);
            t._h = setTimeout(() => t.className = "toast", 2600);
        }

        // ── LOGIN ──
        async function doLogin() {
            const email = $("adminEmail").value.trim();
            const pass = $("adminPassword").value;
            loginError.style.display = "none";
            if (!email || !pass) {
                loginError.textContent = "Enter your email and password.";
                loginError.style.display = "block";
                return;
            }
            if (email.toLowerCase() !== ALLOWED_EMAIL) {
                loginError.textContent = "⛔ Access denied. Only the admin can log in.";
                loginError.style.display = "block";
                return;
            }
            const btn = $("loginBtn");
            btn.disabled = true;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (e) {
                loginError.textContent = e.code === "auth/too-many-requests"
                    ? "Too many attempts. Please wait a few minutes and try again."
                    : "❌ Invalid credentials. Try again.";
                loginError.style.display = "block";
            } finally {
                btn.disabled = false;
            }
        }
        $("loginBtn").addEventListener("click", doLogin);
        ["adminEmail", "adminPassword"].forEach(id =>
            $(id).addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); }));

        $("logoutBtn").addEventListener("click", () => signOut(auth));

        // ── AUTH STATE ──
        onAuthStateChanged(auth, (user) => {
            const ok = user && (user.email || "").toLowerCase() === ALLOWED_EMAIL;
            if (!ok) {
                loginBox.style.display = "flex";
                dashboard.style.display = "none";
                if (unsubscribe) { unsubscribe(); unsubscribe = null; }
                if (user) {
                    signOut(auth);
                    loginError.textContent = "⛔ Access denied. Unauthorized account.";
                    loginError.style.display = "block";
                }
                return;
            }
            loginBox.style.display = "none";
            dashboard.style.display = "block";
            pages = 1;
            startLiveListener();
        });

        // ── REAL-TIME LISTENER (window grows with Load More) ──
        function startLiveListener() {
            if (unsubscribe) unsubscribe();
            const windowSize = PAGE_SIZE * pages;
            const q = query(contactsCol, orderBy("createdAt", "desc"), limit(windowSize));
            unsubscribe = onSnapshot(q, (snap) => {
                allMessages = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                hasMore = snap.size === windowSize;
                loadMoreBtn.disabled = !hasMore;
                loadMoreBtn.innerHTML = hasMore
                    ? '<i class="fa fa-plus" aria-hidden="true"></i> Load More'
                    : '<i class="fa fa-check" aria-hidden="true"></i> All messages loaded';
                renderMessages();
                refreshCounts();
            }, (err) => {
                console.error(err);
                toast("Couldn't load messages: " + (err.code || err.message), true);
            });
        }

        loadMoreBtn.addEventListener("click", () => {
            if (!hasMore) return;
            pages++;
            startLiveListener();
        });

        // ── STATS: true totals from the server, not just the loaded page ──
        async function refreshCounts() {
            const now = new Date();
            const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const weekStart = new Date(todayStart); weekStart.setDate(weekStart.getDate() - 6);
            const count = async (q) => (await getCountFromServer(q)).data().count;
            try {
                const [total, unread, today, week] = await Promise.all([
                    count(contactsCol),
                    count(query(contactsCol, where("isRead", "==", false))),
                    count(query(contactsCol, where("createdAt", ">=", Timestamp.fromDate(todayStart)))),
                    count(query(contactsCol, where("createdAt", ">=", Timestamp.fromDate(weekStart))))
                ]);
                $("statTotal").textContent = total;
                $("statUnread").textContent = unread;
                $("statToday").textContent = today;
                $("statWeek").textContent = week;
                $("loadedInfo").textContent = `Showing ${allMessages.length} of ${total} messages`;
            } catch (e) {
                // Fallback: count what is loaded
                console.warn("Count query failed, using loaded messages:", e);
                $("statTotal").textContent = allMessages.length + (hasMore ? "+" : "");
                $("statUnread").textContent = allMessages.filter(m => !m.isRead).length;
                const isAfter = (m, d) => m.createdAt?.toDate && m.createdAt.toDate() >= d;
                $("statToday").textContent = allMessages.filter(m => isAfter(m, todayStart)).length;
                $("statWeek").textContent = allMessages.filter(m => isAfter(m, weekStart)).length;
                $("loadedInfo").textContent = `Showing ${allMessages.length} messages`;
            }
        }

        // ── FILTER + SEARCH ──
        function visibleMessages() {
            const term = searchInput.value.toLowerCase().trim();
            return allMessages
                .filter(m => activeFilter === "all" || (activeFilter === "unread" ? !m.isRead : !!m.isStarred))
                .filter(m => !term ||
                    `${m.firstName || ""} ${m.lastName || ""}`.toLowerCase().includes(term) ||
                    (m.email || "").toLowerCase().includes(term) ||
                    (m.subject || "").toLowerCase().includes(term) ||
                    (m.message || "").toLowerCase().includes(term))
                .sort((a, b) => (b.isStarred ? 1 : 0) - (a.isStarred ? 1 : 0)); // starred first, then newest
        }

        document.querySelectorAll(".chip-btn").forEach(btn => btn.addEventListener("click", () => {
            activeFilter = btn.dataset.filter;
            document.querySelectorAll(".chip-btn").forEach(b => b.classList.toggle("active", b === btn));
            renderMessages();
        }));
        searchInput.addEventListener("input", renderMessages);

        // ── RENDER ──
        const esc = (str) => { const d = document.createElement("div"); d.textContent = str ?? ""; return d.innerHTML; };

        function renderMessages() {
            $("nAll").textContent = `(${allMessages.length})`;
            $("nUnread").textContent = `(${allMessages.filter(m => !m.isRead).length})`;
            $("nStarred").textContent = `(${allMessages.filter(m => m.isStarred).length})`;

            const list = visibleMessages();
            if (!list.length) {
                const term = searchInput.value.trim();
                msgContainer.innerHTML = `<div class="empty-state"><i class="fa fa-inbox"></i>
                    <p>${term || activeFilter !== "all" ? "No messages match this view." : "No messages yet."}</p></div>`;
                return;
            }

            msgContainer.innerHTML = list.map((m, i) => {
                const time = m.createdAt?.toDate
                    ? m.createdAt.toDate().toLocaleString("en-IN", { dateStyle: "medium", timeStyle: "short" }) : "—";
                const name = `${m.firstName || ""} ${m.lastName || ""}`.trim();
                const mailto = `mailto:${encodeURIComponent(m.email || "")}?subject=${encodeURIComponent("Re: " + (m.subject || "Your message"))}`;
                return `
                <div class="msg-card" style="animation-delay:${Math.min(i, 10) * 40}ms;${!m.isRead ? "border-left:4px solid var(--indigo);" : ""}">
                    <div class="msg-header">
                        <div>
                            <div class="msg-sender">
                                ${m.isStarred ? '<i class="fa fa-star" style="color:#facc15;margin-right:6px" aria-hidden="true"></i>' : ""}
                                ${esc(name || "(no name)")}
                                ${!m.isRead ? '<span style="margin-left:8px;font-size:.7rem;color:var(--indigo);font-weight:700">NEW</span>' : ""}
                            </div>
                            <div class="msg-email">${esc(m.email)}</div>
                        </div>
                        <div style="display:flex;gap:8px;flex-wrap:wrap">
                            <a class="btn btn-ghost btn-sm" href="${mailto}" title="Reply by email" aria-label="Reply"><i class="fa fa-reply"></i></a>
                            <button type="button" class="btn btn-ghost btn-sm" data-act="read" data-id="${m.id}" data-v="${m.isRead ? 1 : 0}"
                                title="${m.isRead ? "Mark as unread" : "Mark as read"}" aria-label="${m.isRead ? "Mark as unread" : "Mark as read"}">
                                <i class="fa ${m.isRead ? "fa-envelope-open" : "fa-envelope"}"></i></button>
                            <button type="button" class="btn btn-ghost btn-sm" data-act="star" data-id="${m.id}" data-v="${m.isStarred ? 1 : 0}"
                                title="${m.isStarred ? "Unstar" : "Star"}" aria-label="${m.isStarred ? "Unstar" : "Star"}">
                                <i class="${m.isStarred ? "fa fa-star" : "fa-regular fa-star"}"></i></button>
                            <button type="button" class="btn btn-danger btn-sm" data-act="delete" data-id="${m.id}" title="Delete" aria-label="Delete">
                                <i class="fa fa-trash"></i></button>
                        </div>
                    </div>
                    <div class="msg-subject"><i class="fa fa-tag" style="opacity:.5;margin-right:6px"></i>${esc(m.subject || "No subject")}</div>
                    <div class="msg-body">${esc(m.message)}</div>
                    <div class="msg-time"><i class="fa fa-clock"></i> ${time}</div>
                </div>`;
            }).join("");
        }

        // One delegated handler for all card buttons
        msgContainer.addEventListener("click", async (e) => {
            const btn = e.target.closest("button[data-act]");
            if (!btn) return;
            const { act, id } = btn.dataset;
            if (act === "delete") { deleteTargetId = id; deleteModal.classList.add("show"); $("cancelDelete").focus(); return; }
            btn.disabled = true;
            try {
                if (act === "read") await updateDoc(doc(db, "contacts", id), { isRead: btn.dataset.v !== "1" });
                if (act === "star") await updateDoc(doc(db, "contacts", id), { isStarred: btn.dataset.v !== "1" });
            } catch (err) {
                console.error(err);
                toast("Update failed: " + (err.code || err.message), true);
                btn.disabled = false;
            }
        });

        // ── DELETE ──
        const closeModal = () => { deleteModal.classList.remove("show"); deleteTargetId = null; };
        $("cancelDelete").addEventListener("click", closeModal);
        deleteModal.addEventListener("click", (e) => { if (e.target === deleteModal) closeModal(); });
        document.addEventListener("keydown", (e) => { if (e.key === "Escape" && deleteModal.classList.contains("show")) closeModal(); });
        $("confirmDelete").addEventListener("click", async () => {
            if (!deleteTargetId) return;
            try {
                await deleteDoc(doc(db, "contacts", deleteTargetId));
                toast("Message deleted");
            } catch (e) {
                console.error("Delete failed:", e);
                toast("Delete failed: " + (e.code || e.message), true);
            }
            closeModal();
        });

        // ── MARK SHOWN AS READ (single batched write) ──
        $("markAllReadBtn").addEventListener("click", async () => {
            const targets = visibleMessages().filter(m => !m.isRead);
            if (!targets.length) { toast("Nothing unread in this view"); return; }
            try {
                const batch = writeBatch(db);
                targets.forEach(m => batch.update(doc(db, "contacts", m.id), { isRead: true }));
                await batch.commit();
                toast(`Marked ${targets.length} as read`);
            } catch (e) {
                console.error(e);
                toast("Couldn't mark as read: " + (e.code || e.message), true);
            }
        });

        // ── EXPORT ALL MESSAGES TO EXCEL ──
        $("exportBtn").addEventListener("click", async () => {
            if (!window.XLSX) { toast("Excel library failed to load", true); return; }
            const btn = $("exportBtn");
            btn.disabled = true;
            try {
                const snap = await getDocs(query(contactsCol, orderBy("createdAt", "desc")));
                const rows = snap.docs.map(d => {
                    const m = d.data();
                    return {
                        Date: m.createdAt?.toDate ? m.createdAt.toDate().toLocaleString("en-IN") : "",
                        Name: `${m.firstName || ""} ${m.lastName || ""}`.trim(),
                        Email: m.email || "",
                        Subject: m.subject || "",
                        Message: m.message || "",
                        Read: m.isRead ? "Yes" : "No",
                        Starred: m.isStarred ? "Yes" : "No"
                    };
                });
                const ws = XLSX.utils.json_to_sheet(rows);
                ws["!cols"] = [{ wch: 20 }, { wch: 22 }, { wch: 30 }, { wch: 30 }, { wch: 70 }, { wch: 6 }, { wch: 8 }];
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Messages");
                XLSX.writeFile(wb, `portfolio_messages_${new Date().toISOString().slice(0, 10)}.xlsx`);
                toast(`Exported ${rows.length} messages`);
            } catch (e) {
                console.error(e);
                toast("Export failed: " + (e.code || e.message), true);
            } finally {
                btn.disabled = false;
            }
        });

        // ── THEME TOGGLE (icon shows the theme you will switch to) ──
        const themeIcon = $("themeIcon");
        const syncThemeIcon = () => {
            themeIcon.className = document.documentElement.getAttribute("data-theme") === "dark" ? "fa fa-sun" : "fa fa-moon";
        };
        syncThemeIcon();
        $("themeToggle").addEventListener("click", () => {
            const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
            document.documentElement.setAttribute("data-theme", next);
            try { localStorage.setItem("kk-theme", next); } catch (e) { }
            syncThemeIcon();
        });
    </script>

</body>

</html>
